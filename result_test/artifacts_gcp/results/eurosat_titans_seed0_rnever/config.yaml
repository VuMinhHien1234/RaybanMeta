seed: 0
device: auto
data:
  name: eurosat
  root: ./data
  split_seed: 0
  num_tasks: 5
  shuffle_classes: true
  image_size: 64
  batch_size: 128
  num_workers: 2
backbone:
  name: resnet18
  pretrained: true
  freeze: true
memory:
  enabled: true
  dim: auto
  chunk_size: 64
  seq: image_seq
  reset: never
train:
  method: titans
  optimizer: adamw
  epochs_per_task: 3
  lr: 0.001
  weight_decay: 0.01
  eval_future: true
  m3:
    alpha: 0.5
    frequency: 16
    beta_style: delta
    delta:
      alpha:
      - 0.999
      - 0.9999
      eta:
      - 0.1
      - 0.05
log:
  dir: ./artifacts
