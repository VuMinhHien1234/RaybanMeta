seed: 0
device: auto
data:
  name: eurosat
  root: ./data
  split_seed: 0
  num_tasks: 5
  shuffle_classes: true
  image_size: 64
  batch_size: 128
  num_workers: 2
backbone:
  name: resnet18
  pretrained: true
  freeze: false
train:
  method: finetune
  epochs_per_task: 3
  lr: 0.0003
  weight_decay: 0.01
  eval_future: false
ewc:
  ewc_lambda: 1000.0
  max_batches: 50
replay:
  buffer_per_class: 20
  replay_batch: 64
  weight: 1.0
lwf:
  lwf_lambda: 1.0
  temperature: 2.0
log:
  dir: ./artifacts
