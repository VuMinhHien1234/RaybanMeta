# G1 — dataset chính: NWPU-RESISC45 (31.500 ảnh trên không, 45 class)
# Tự tải từ HuggingFace (~426MB) vào data/hf_cache ở lần chạy đầu.
# 45 class -> 9 task x 5 class: stream đủ dài để thấy quên rõ.
seed: 0
device: auto

data:
  name: resisc45
  hf_repo: timm/resisc45
  root: ./data
  num_tasks: 9
  shuffle_classes: true
  image_size: 224          # khớp ViT pretrained
  batch_size: 32
  num_workers: 2

backbone:
  name: vit_small_patch16_224
  pretrained: true
  freeze: false            # full fine-tune; đặt true nếu chỉ muốn train head (nhanh hơn nhiều)

train:
  method: finetune         # finetune | ewc | replay | lwf | ncm (CLI --method sẽ đè)
  epochs_per_task: 3
  lr: 0.0001
  weight_decay: 0.01
  eval_future: false       # true -> đo thêm R[t,t+1] để tính Forward Transfer (chậm hơn chút)

ewc:
  ewc_lambda: 1000.0       # núm chính của EWC — thử 100 / 1000 / 10000
  max_batches: 50

replay:
  buffer_per_class: 20     # 45 class x 20 ảnh 224² float16 ~ 270MB RAM — giảm nếu máy yếu
  replay_batch: 32
  weight: 1.0

lwf:
  lwf_lambda: 1.0          # thử 0.5 / 1 / 2
  temperature: 2.0

log:
  dir: ./artifacts
