# ARM 2 (B2) — SLDA gốc: Σ_w cập nhật streaming. Đây là cấu hình đã cho 0.8263.
# Sinh tự động 2026-08-02, chỉ khác nhau ở khối `slda`.
seed: 0
device: auto
data:
  name: resisc45
  hf_repo: timm/resisc45
  root: ./data
  split_protocol: combined31500_v2
  expected_total_samples: 31500
  expected_samples_per_class: 700
  num_tasks: 9
  shuffle_classes: true
  image_size: 224
  batch_size: 32
  num_workers: 2
backbone:
  name: vit_small_patch16_224
  pretrained: true
  freeze: true
memory:
  enabled: false
  dim: auto
  chunk_size: 32
  seq: image_seq
  reset: never
  gated_transition: true
  spectral_norm_surprises: true
  qk_rmsnorm: true
  max_grad_norm: 1.0
  depth: 3
  heads: 1
  self_modifying: true
  self_modifying_readpath: false
train:
  method: slda
  optimizer: m3
  epochs_per_task: 1
  lr: 0.001
  weight_decay: 0.01
  grad_clip_norm: 1.0
  optimizer_per_task: false
  eval_future: true
  m3:
    alpha: 0.5
    frequency: 16
    beta_style: delta
    update_norm: clip
    delta:
      alpha:
      - 0.999
      - 0.9999
      eta:
      - 0.1
      - 0.05
log:
  dir: ./artifacts_slda_streaming
slda:
  shrinkage: 0.0001
  cov_mode: streaming
