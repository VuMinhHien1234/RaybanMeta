# ARM 2 (ORACLE) — BAY LAP LAI, lam_mu=0.99, CO NHAN moi chuyen.
# KIEM LAI ket qua D10: tren stream troi DON DIEU, arm nay hon lam=1 toi 3,91 diem o muc
# troi 100%. Nhung do la vi dieu kien cu KHONG BAO GIO quay lai nen quen di la lai.
# O day dieu kien CO quay lai -> con so do co the DAO DAU. Day chinh la thi nghiem.
# LUU Y (P1): lam_mu chi co nghia o track CO NHAN nay — track khong nhan (U*) khong
# update mu_c nen khong co gi de quen.
seed: 0
device: auto
data:
  name: resisc45
  hf_repo: timm/resisc45
  root: ./data
  split_protocol: combined31500_v2
  expected_total_samples: 31500
  expected_samples_per_class: 700
  num_tasks: 12
  shuffle_classes: false
  image_size: 224
  batch_size: 32
  num_workers: 2
  stream_type: revisit
  drift:
    enabled: true
    che_do: tuan_hoan
    chu_ky: 4
    n_mode: 3
    mode: linear
    severity: 1.0
    jitter: 0.15
    apply_to:
    - train
    - val
    - test
backbone:
  name: vit_small_patch16_224
  pretrained: true
  freeze: true
train:
  method: slda
  epochs_per_task: 1
log:
  dir: ./artifacts_revisit_arm2_quen
slda:
  shrinkage: 0.0001
  cov_mode: streaming
  decay_mean: 0.99
  decay_cov: 0.9999
