seed: 0
device: auto

data:
  name: synthetic
  split_protocol: synthetic_ncm_smoke
  num_classes: 6
  train_per_class: 8
  val_per_class: 4
  test_per_class: 4
  split_seed: 0
  num_tasks: 3
  shuffle_classes: true
  image_size: 32
  batch_size: 8
  prototype_batch_size: 8
  num_workers: 0

backbone:
  name: tinycnn
  pretrained: false
  freeze: true

memory:
  enabled: true
  dim: auto
  chunk_size: 8
  seq: image_seq
  reset: never
  gated_transition: true
  spectral_norm_surprises: true
  qk_rmsnorm: true
  max_grad_norm: 1.0
  depth: 3
  heads: 1
  self_modifying: true
  self_modifying_readpath: false

train:
  method: titans
  optimizer: m3
  epochs_per_task: 1
  lr: 0.005
  weight_decay: 0.01
  grad_clip_norm: 1.0
  optimizer_per_task: false
  eval_future: false
  eval_feature_protocol: independent_image
  ncm:
    enabled: true
    readouts:
      - online_current_task
      - posthoc_full_seen_train
    feature_protocol: independent_image
    prototype_transform: eval
    fail_on_nonfinite: true
    save_state: true
  m3:
    alpha: 0.5
    frequency: 16
    beta_style: delta
    update_norm: clip
    delta:
      alpha: [0.999, 0.9999]
      eta: [0.1, 0.05]

log:
  dir: ./artifacts_ncm_head
  run_tag: smoke
