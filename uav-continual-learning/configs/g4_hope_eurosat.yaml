# G4 — HOPE trên EuroSAT: Titans xuyên task (tầng nhanh) + ViT-CMS (tầng trung/chậm) + M3-delta.
# ĐÃ THAY (fix 07-18): cms.order/tiers = CẤU HÌNH THẮNG G3 early_slow p1-8-64 (Acc 38.8%
# vs late_slow 27.4% — xem result_test/artifacts_gcp/results/baseline_table.md). Run cũ
# HOPE 21.7%/F 0.956 cũng đã chạy early_slow p1-8-64 nên tên thư mục kết quả so được 1-1.
# So trực tiếp với: titans-C (G2), cms-best (G3) trên cùng stream — trả lời "1+1 > 2?".
seed: 0
device: auto

data:
  name: eurosat
  root: ./data
  split_seed: 0
  num_tasks: 5
  shuffle_classes: true
  image_size: 224
  batch_size: 64
  num_workers: 2

backbone:
  name: vit_tiny_patch16_224
  pretrained: true
  freeze: false            # HOPE: backbone mở băng, CMS kiểm soát nhịp

memory:                    # tầng NHANH NHẤT (Titans, thiết lập thắng của G2)
  enabled: true
  dim: auto
  chunk_size: 64
  seq: image_seq
  reset: never             # xuyên task — đích G2 đã chốt
  # fix sau khi đọc số --quick 07-17 (norm(state) nhảy 262->302->120->201->179, Forgetting
  # 0.956): bật cờ ổn định có sẵn trong titans-pytorch, đúng bệnh feature-drift của HOPE.
  gated_transition: true
  spectral_norm_surprises: true
  qk_rmsnorm: true
  max_grad_norm: 1.0       # xuất phát điểm — đọc log norm(state) sau smoke để tinh chỉnh

cms:                       # tầng TRUNG + CHẬM — cấu hình THẮNG G3 (early_slow p1-8-64)
  enabled: true
  tiers: [[4, 1], [4, 8], [4, 64]]
  etas: [1.0, 0.5, 0.1]
  order: early_slow
  attn: slow
  grad_agg: sum            # nguyên văn Eq. 71
  eta_mode: fixed           # S9 (TASKS_G4_SOLO §C): đổi "adaptive" để bật η tự tính theo
                             # surprise — để SAU khi 4 cờ titans-pytorch có số (1 biến/lần)
  m3_frequency_unit: global_step

train:
  method: hope             # log cả norm(state) lẫn ‖Δw‖ per-tier
  optimizer: m3
  epochs_per_task: 3
  # Study 3 seed 07-25: 5e-3 uu tien accuracy; dung 3e-3 neu uu tien retention.
  lr: 0.005
  weight_decay: 0.01
  grad_clip_norm: 1.0
  optimizer_per_task: false
  eval_future: true        # FWT là điểm khoe của memory xuyên task
  m3:
    alpha: 0.5
    frequency: 16
    beta_style: delta
    update_norm: clip      # chi co update khi norm > 1; khong khuech dai update nho
    delta:
      alpha: [0.999, 0.9999]
      eta:   [0.1, 0.05]
    key_proj_eta: 0.0       # fix 07-18: xấp xỉ rank-1 của P_i (Eq.48-49), 0=tắt — đổi vd 0.5
                             # để thử "quên có chọn lọc theo hướng" (đọc optim/m3.py)

log:
  dir: ./artifacts
