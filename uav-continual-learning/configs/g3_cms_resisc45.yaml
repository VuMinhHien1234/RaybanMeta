# G3 — CMS retrofit trên RESISC45 (bảng chính). ViT-S mở băng + CMSOptimizer + M3.
# Chạy với cấu hình THẮNG ở ablation EuroSAT (S9), ví dụ:
#   python scripts/run_g1.py --config configs/g3_cms_resisc45.yaml --set cms.order=late_slow
# Mốc so (docs/KET_LUAN_G1.md): thắng đậm finetune 0.4144/F 0.6133;
# đích đẹp: Acc >= 0.65 & Forgetting <= 0.2 với method_extra_floats ~ 0.
seed: 0
device: auto

data:
  name: resisc45
  hf_repo: timm/resisc45
  root: ./data
  num_tasks: 9
  shuffle_classes: true
  image_size: 224
  batch_size: 32
  num_workers: 2

backbone:
  name: vit_small_patch16_224
  pretrained: true
  freeze: false

cms:
  enabled: true
  tiers: [[4, 1], [4, 4], [4, 16]]
  etas: [1.0, 0.5, 0.1]
  order: late_slow
  attn: slow
  grad_agg: sum                      # sum = NGUYEN VAN Eq. 71; mean = bien the on dinh lr

train:
  method: cms
  optimizer: m3
  epochs_per_task: 3
  lr: 0.0001
  weight_decay: 0.01
  eval_future: false
  m3:
    alpha: 0.5
    frequency: 16
    beta_style: delta      # Delta Momentum (Eq. 48-49): chi ghi (g - m), cong quen alpha rieng
    delta:
      alpha: [0.999, 0.9999] # cong quen (ky uc nhanh, cham)
      eta:   [0.1, 0.05]     # toc do ghi (ky uc nhanh, cham)

log:
  dir: ./artifacts
