# TASK 4+5 (2026-08-02) — Titans + CỔNG ĐÃ ĐƯỢC CHẶN, KHÔNG bật CMS.
# Dùng cho TASK 8 (smoke đọc η/α) và TASK 9 (so 1-biến với bản improved gốc).
# Chỉ khác g2_titans_resisc45_selfmod_m3_improved.yaml đúng 1 nhóm: khối gate_bound/pre_norm/init_*.
seed: 0
device: auto

data:
  name: resisc45
  hf_repo: timm/resisc45
  root: ./data
  split_protocol: combined31500_v2
  expected_total_samples: 31500
  expected_samples_per_class: 700
  num_tasks: 9
  shuffle_classes: true
  image_size: 224
  batch_size: 32
  num_workers: 2

backbone:
  name: vit_small_patch16_224
  pretrained: true
  freeze: true

memory:
  enabled: true
  dim: auto
  chunk_size: 32
  seq: image_seq
  reset: never
  gated_transition: true
  spectral_norm_surprises: true
  qk_rmsnorm: true
  max_grad_norm: 1.0
  depth: 3
  heads: 1
  self_modifying: true
  self_modifying_readpath: false
  # TASK 4 — chặn TRÔI cổng η/α. trace_gates.py cho thấy α khởi đầu lành mạnh (0.10-0.89)
  # rồi trôi đơn điệu ra biên trong 2-4 task vì gradient thấy "quên nhiều" giảm loss task
  # hiện tại. tanh-bound giữ logit trong ±limit -> cổng không thoát ra biên, Eq 76 vẫn sống.
  gate_bound:
    alpha_logit_limit: 2.9444   # α ∈ [0.05, 0.95]
    eta_logit_limit: 2.1972     # η ∈ [0.1, 0.9] — max_lr THẬT = 1.0, KHÔNG phải 1e-2
    # comment cũ ghi [1e-3, 9e-3] là SAI 100 lần (giả định max_lr=1e-2). Log 9 task cho
    # thấy η bò tới 0.896/0.900 = 99.5% trần -> cổng thành hằng số, hết phụ thuộc dữ liệu.
    # Muốn η nhỏ phải DỜI TÂM (eta_logit_center), không thể chỉ đổi độ rộng.
    alpha_logit_center: 0.0     # 0.0 = trần đối xứng quanh logit 0 (hành vi cũ)
    eta_logit_center: 0.0       # 0.0 -> tâm η = sigmoid(0)*max_lr = 0.5
  pre_norm: true                # chuẩn hoá đầu vào memory (bổ trợ: sửa thang đo lúc khởi tạo)
  # TASK 5 — khởi tạo cổng trung tính (thư viện hỗ trợ sẵn, neural_memory.py:526-540)
  init_decay_bias: 0.0          # α khởi đầu = 0.5
  init_adaptive_step_bias: 0.0  # η khởi đầu = 0.5*max_lr = 0.5 (KHÔNG phải 5e-3)

train:
  method: titans
  optimizer: m3
  epochs_per_task: 3
  lr: 0.001
  weight_decay: 0.01
  grad_clip_norm: 1.0
  optimizer_per_task: false
  eval_future: true
  m3:
    alpha: 0.5
    frequency: 16
    beta_style: delta
    update_norm: clip
    delta:
      alpha: [0.999, 0.9999]
      eta: [0.1, 0.05]

log:
  dir: ./artifacts_titan_m3_gates
