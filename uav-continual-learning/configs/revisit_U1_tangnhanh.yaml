# U1 — TRACK CHINH (khong nhan): U0 + TANG NHANH (M1).
# Cau hoi tra loi: can chinh KHONG NHAN dang gia bao nhieu? (O2 + acc dieu kien hien tai)
# So U1 − U0 la phep so MOT BIEN.
# ⛔ CUA CHAN (KE_HOACH_SUA nhom D): U1 khong hon U0 -> DUNG, khong lam M2.
# GHI CHU T1: kieu=day_du chay duoc NGAY. Sau khi chay T1 (nhom B) ma ket luan TRUC_CHUNG
# thi doi sang kieu: truc + truc_json: artifacts_t1/t1_t2.json — chong bay ty le lop (T2).
seed: 0
device: auto
data:
  name: resisc45
  hf_repo: timm/resisc45
  root: ./data
  split_protocol: combined31500_v2
  expected_total_samples: 31500
  expected_samples_per_class: 700
  num_tasks: 12
  shuffle_classes: false
  image_size: 224
  batch_size: 32
  num_workers: 2
  stream_type: revisit
  pha2:
    khong_nhan: true
    chuyen_hieu_chinh: 1
    test_chung: true
    thu_tu_thoi_gian: true
  drift:
    enabled: true
    che_do: tuan_hoan
    chu_ky: 4
    n_mode: 3
    mode: linear
    severity: 1.0
    jitter: 0.15
    trong_chuyen:
      enabled: true
      bien_do: 0.25
    apply_to:
    - train
    - val
    - test
backbone:
  name: vit_small_patch16_224
  pretrained: true
  freeze: true
train:
  method: slda
  epochs_per_task: 1
log:
  dir: ./artifacts_revisit_U1
slda:
  shrinkage: 0.0001
  cov_mode: streaming
  decay_mean: 1.0
  decay_cov: 1.0
  tang_nhanh:
    enabled: true
    decay: 0.99          # cua so ~100 mau ~ vai chuc giay bay
    kieu: day_du         # doi sang 'truc' + truc_json sau khi T1 ket luan TRUC_CHUNG
    # truc_json: artifacts_t1/t1_t2.json
