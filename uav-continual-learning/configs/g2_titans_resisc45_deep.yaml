# TASK 0 + BẬC 1 — Testbed REGIME DÀI cho Nested Learning: RESISC45 9-task + memory SÂU.
# Vì sao: EuroSAT 5-task/feature-đóng-băng KHÔNG phân biệt được self-modifying vs vanilla
# (NCM đã 74.9%). Self-modifying/deep memory chỉ tỏa sáng ở chuỗi DÀI, nhiều task -> đây là
# regime chuẩn để đo Task 1/3/4. Mốc so (KET_LUAN_G1): vượt ncm 0.6933; mơ tới replay 0.7937.
#
# = g2_titans_resisc45 (9 task, ViT-S 384) + reset=never (xuyên task) + memory sâu (depth3/heads2).
seed: 0
device: auto

data:
  name: resisc45
  hf_repo: timm/resisc45
  root: ./data
  num_tasks: 9
  shuffle_classes: true
  image_size: 224
  batch_size: 32
  num_workers: 2

backbone:
  name: vit_small_patch16_224
  pretrained: true
  freeze: true

memory:
  enabled: true
  dim: auto                # = 384
  chunk_size: 32
  seq: image_seq
  reset: never             # xuyên task (bậc C) — regime để memory thể hiện
  gated_transition: true
  spectral_norm_surprises: true
  qk_rmsnorm: true
  max_grad_norm: 1.0
  depth: 3                 # BẬC 1: memory MLP 2 -> 3 lớp (đòn bẩy "Deep" chính của paper)
  heads: 1                 # heads>1 -> tham số overlapping-memory, kẹt weight-decay của M3; để 1, xử lý sau

train:
  method: titans
  optimizer: m3            # đối chứng: --set train.optimizer=adamw
  epochs_per_task: 3
  lr: 0.001
  weight_decay: 0.01
  eval_future: true
  m3:
    alpha: 0.5
    frequency: 16
    beta_style: delta
    delta:
      alpha: [0.999, 0.9999]
      eta:   [0.1, 0.05]

log:
  dir: ./artifacts_titans_resisc45_deep
