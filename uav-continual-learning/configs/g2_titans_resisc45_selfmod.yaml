# TASK 4 — Self-Modifying Titans (NL §8.1 cuối) trên regime dài RESISC45 9-task.
# = g2_titans_resisc45_selfref + bật self_modifying (value TỰ SINH theo trạng thái memory M_{t-1}).
# So 1-BIẾN với g2_titans_resisc45_selfref (chỉ khác memory.self_modifying) để đo self-mod thêm được gì.
# self_modifying BAO TRÙM self_referential (Task 3) -> không cần bật self_referential riêng.
# ⚠️ CHẠY TEST TRƯỚC: pytest tests/test_self_modifying_memory.py -q  (code chưa được train-kiểm-chứng).
# Baseline để so (Task 3, đã đo): selfref avg_acc 0.2503 / forgetting 0.7193.
seed: 0
device: auto

data:
  name: resisc45
  hf_repo: timm/resisc45
  root: ./data
  num_tasks: 9
  shuffle_classes: true
  image_size: 224
  batch_size: 32
  num_workers: 2

backbone:
  name: vit_small_patch16_224
  pretrained: true
  freeze: true

memory:
  enabled: true
  dim: auto
  chunk_size: 32
  seq: image_seq
  reset: never
  gated_transition: true
  spectral_norm_surprises: true
  qk_rmsnorm: true
  max_grad_norm: 1.0
  depth: 3
  heads: 1                 # heads>1 -> tham số overlapping-memory, kẹt weight-decay của M3; để 1, xử lý sau
  self_modifying: true     # <-- TASK 4: value = f(x_t, summary(M_{t-1})) — vòng tự tham chiếu đầy đủ

train:
  method: titans
  optimizer: m3
  epochs_per_task: 3
  lr: 0.001
  weight_decay: 0.01
  eval_future: true
  m3:
    alpha: 0.5
    frequency: 16
    beta_style: delta
    delta:
      alpha: [0.999, 0.9999]
      eta:   [0.1, 0.05]

log:
  dir: ./artifacts_titans_resisc45_selfmod
