# D11 arm B — Titans tren stream TROI, TRAN eta DOI TAM.
# Day la lan dau Nested Learning duoc do o regime cua chinh no (domain shift).
seed: 0
device: auto
data:
  name: resisc45
  hf_repo: timm/resisc45
  root: ./data
  split_protocol: combined31500_v2
  expected_total_samples: 31500
  expected_samples_per_class: 700
  num_tasks: 9
  shuffle_classes: false
  image_size: 224
  batch_size: 32
  num_workers: 2
  stream_type: domain
  drift:
    enabled: true
    mode: linear
    severity: 1.0
    jitter: 0.15
    apply_to:
    - train
    - val
    - test
backbone:
  name: vit_small_patch16_224
  pretrained: true
  freeze: true
memory:
  enabled: true
  dim: auto
  chunk_size: 32
  seq: image_seq
  reset: never
  gated_transition: true
  spectral_norm_surprises: true
  qk_rmsnorm: true
  max_grad_norm: 1.0
  depth: 3
  heads: 1
  self_modifying: true
  self_modifying_readpath: false
  gate_bound:
    alpha_logit_limit: 2.9444
    alpha_logit_center: 0.0
    # ARM B — TRAN eta DA DOI TAM.
    # Tran doi xung LUON co tam sigmoid(0)*max_lr = 0.5 bat ke do rong -> muon eta nho thi
    # PHAI doi tam, khong the chi noi/thu do rong. Day la han che CAU TRUC cua cong thuc cu.
    # tam -2.2 -> eta in [0.0121, 0.500], tam 0.0998 (thap hon arm A 5 lan).
    # Rong 41x (arm A chi 9x) -> cong con nhieu cho de PHU THUOC DU LIEU thay vi dinh tran.
    eta_logit_limit: 2.2
    eta_logit_center: -2.2
  pre_norm: true
  init_decay_bias: 0.0
  init_adaptive_step_bias: 0.0
train:
  method: titans
  optimizer: m3
  epochs_per_task: 3
  lr: 0.001
  weight_decay: 0.01
  grad_clip_norm: 1.0
  optimizer_per_task: false
  eval_future: true
  m3:
    alpha: 0.5
    frequency: 16
    beta_style: delta
    update_norm: clip
    delta:
      alpha:
      - 0.999
      - 0.9999
      eta:
      - 0.1
      - 0.05
log:
  dir: ./artifacts_drift_titans_eta_thap
