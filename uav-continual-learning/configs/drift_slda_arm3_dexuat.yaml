# *** CAU HINH DE XUAT — hai lambda khac nhau ***
# Stream DOMAIN-incremental + troi dan. Sinh tu dong 2026-08-03.
# Chi khac cac arm khac o khoi `slda.decay_*`.
seed: 0
device: auto
data:
  name: resisc45
  hf_repo: timm/resisc45
  root: ./data
  split_protocol: combined31500_v2
  expected_total_samples: 31500
  expected_samples_per_class: 700
  num_tasks: 9
  shuffle_classes: false
  image_size: 224
  batch_size: 32
  num_workers: 2
  stream_type: domain
  drift:
    enabled: true
    mode: linear
    severity: 1.0
    jitter: 0.15
    apply_to:
    - train
    - val
    - test
backbone:
  name: vit_small_patch16_224
  pretrained: true
  freeze: true
memory:
  enabled: false
  dim: auto
  chunk_size: 32
  seq: image_seq
  reset: never
  gated_transition: true
  spectral_norm_surprises: true
  qk_rmsnorm: true
  max_grad_norm: 1.0
  depth: 3
  heads: 1
  self_modifying: true
  self_modifying_readpath: false
train:
  method: slda
  optimizer: m3
  epochs_per_task: 1
  lr: 0.001
  weight_decay: 0.01
  grad_clip_norm: 1.0
  optimizer_per_task: false
  eval_future: true
  m3:
    alpha: 0.5
    frequency: 16
    beta_style: delta
    update_norm: clip
    delta:
      alpha:
      - 0.999
      - 0.9999
      eta:
      - 0.1
      - 0.05
log:
  dir: ./artifacts_drift_arm3_dexuat
slda:
  shrinkage: 0.0001
  cov_mode: streaming
  # Chinh lai 2026-08-03: n_c=99, trai 2,1 task. Troi dich 12,5%/task nen cua so ~2 task
  # la cho hop ly nhat de bam theo ma van du mau uoc luong mu_c (384 chieu).
  decay_mean: 0.99
  decay_cov: 0.9999
