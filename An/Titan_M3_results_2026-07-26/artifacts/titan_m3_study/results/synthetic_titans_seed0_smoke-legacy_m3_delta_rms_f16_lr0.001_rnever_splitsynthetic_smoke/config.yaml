seed: 0
device: auto
data:
  name: synthetic
  hf_repo: timm/resisc45
  root: ./data
  split_protocol: synthetic_smoke
  expected_total_samples: 31500
  expected_samples_per_class: 700
  num_tasks: 3
  shuffle_classes: true
  image_size: 32
  batch_size: 8
  num_workers: 0
  num_classes: 6
  train_per_class: 8
  val_per_class: 4
  test_per_class: 4
backbone:
  name: tinycnn
  pretrained: false
  freeze: true
memory:
  enabled: true
  dim: auto
  chunk_size: 8
  seq: image_seq
  reset: never
  gated_transition: true
  spectral_norm_surprises: true
  qk_rmsnorm: true
  max_grad_norm: 1.0
  depth: 3
  heads: 1
  self_modifying: true
  self_modifying_readpath: false
train:
  method: titans
  optimizer: m3
  epochs_per_task: 1
  lr: 0.001
  weight_decay: 0.01
  optimizer_per_task: true
  eval_future: false
  m3:
    alpha: 0.5
    frequency: 16
    beta_style: delta
    update_norm: rms
    delta:
      alpha:
      - 0.999
      - 0.9999
      eta:
      - 0.1
      - 0.05
  eval_ncm_head: false
  max_state_norm: 10000
  max_state_norm_growth: 10
log:
  dir: /home/an/RaybanMeta/uav-continual-learning/artifacts/titan_m3_study
  run_tag: smoke-legacy
